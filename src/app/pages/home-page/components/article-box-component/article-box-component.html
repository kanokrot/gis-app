<article class="group relative flex max-w-md flex-col items-start">
    <h2 class="text-base font-semibold tracking-tight text-zinc-800 dark:text-zinc-100">
        <div class="absolute -inset-x-4 -inset-y-6 z-0 scale-95 rounded-2xl bg-zinc-50 opacity-0 transition group-hover:scale-100 group-hover:opacity-100 sm:-inset-x-6 dark:bg-zinc-800/50"></div>
        <a [href]="article?.url" target="_blank" rel="noopener noreferrer">
            <span class="absolute -inset-x-4 -inset-y-6 z-20 sm:-inset-x-6"></span>
            <span class="relative z-10">{{ article?.title }}</span>
        </a>
    </h2>
    <time class="relative z-10 order-first mb-3 flex items-center pl-3.5 text-sm text-zinc-400"
        [attr.datetime]="article?.date"><span class="absolute inset-y-0 left-0 flex items-center"><span
                class="h-4 w-0.5 rounded-full bg-zinc-200 dark:bg-zinc-700"></span></span>{{ article?.publishedAt }}</time>
    <p class="relative z-10 mt-2 text-sm text-zinc-600 dark:text-zinc-300">{{ article?.summary }}</p>
    <a class="relative z-10 mt-4 flex items-center text-sm font-medium text-teal-600 dark:text-teal-400"
        [href]="article?.url" target="_blank" rel="noopener noreferrer">Read on Medium
        <span class="ml-1" aria-hidden="true">↗</span>
    </a>
</article>
