<section class="rounded-2xl border border-zinc-200 bg-zinc-50 p-5 dark:border-zinc-800 dark:bg-zinc-900 sm:p-6" aria-label="Feedback summary">
    <div class="grid gap-6 sm:grid-cols-[0.8fr_1.2fr] sm:items-center">
        <div>
            <p class="text-5xl font-bold tracking-tight text-zinc-900 dark:text-zinc-100">{{ totalReviews > 0 ? (averageRating | number:'1.1-1') : '–' }}</p>
            <div class="mt-2 flex items-center gap-1" role="img" [attr.aria-label]="totalReviews > 0 ? (averageRating + ' out of 5 stars') : 'No ratings yet'">
                <span *ngFor="let star of [1, 2, 3, 4, 5]" class="text-xl leading-none" [ngClass]="star > averageRating ? 'text-zinc-300 dark:text-zinc-700' : 'text-teal-500'" aria-hidden="true">{{ star <= averageRating ? '★' : '☆' }}</span>
            </div>
            <p class="mt-2 font-mono text-xs text-zinc-600 dark:text-zinc-400">{{ totalReviews }} {{ totalReviews === 1 ? 'review' : 'reviews' }}</p>
        </div>

        <div class="space-y-2.5">
            <div *ngFor="let star of [5, 4, 3, 2, 1]" class="grid grid-cols-[2rem_minmax(0,1fr)_2.5rem] items-center gap-3 text-xs text-zinc-700 dark:text-zinc-300">
                <span class="font-mono">{{ star }}★</span>
                <div class="h-2 overflow-hidden rounded-full bg-zinc-200 dark:bg-zinc-800" role="progressbar" [attr.aria-label]="star + ' star reviews'" [attr.aria-valuemin]="0" [attr.aria-valuemax]="100" [attr.aria-valuenow]="starPercentages[star]">
                    <div class="h-full rounded-full bg-teal-500 transition-[width]" [style.width.%]="starPercentages[star]"></div>
                </div>
                <span class="text-right font-mono">{{ starPercentages[star] }}%</span>
            </div>
        </div>
    </div>
    <p *ngIf="totalReviews === 0" class="mt-5 border-t border-zinc-200 pt-4 text-sm text-zinc-600 dark:border-zinc-800 dark:text-zinc-400">No feedback yet</p>
</section>
