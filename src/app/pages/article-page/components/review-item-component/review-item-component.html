<article class="rounded-2xl border border-zinc-200 bg-zinc-50 p-5 dark:border-zinc-800 dark:bg-zinc-900">
    <div class="flex items-start gap-3">
        <div class="grid h-10 w-10 shrink-0 place-items-center rounded-full border border-zinc-200 bg-white font-mono text-sm font-semibold text-teal-700 dark:border-zinc-700 dark:bg-zinc-950 dark:text-teal-400" aria-hidden="true">
            {{ review.username.trim().charAt(0).toUpperCase() || '?' }}
        </div>
        <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-start justify-between gap-x-4 gap-y-1">
                <h3 class="text-sm font-semibold text-zinc-900 dark:text-zinc-100">{{ review.username }}</h3>
                <time *ngIf="review.created_at as createdAt" class="font-mono text-xs text-zinc-600 dark:text-zinc-400" [attr.datetime]="createdAt">{{ createdAt | date:'MMM d, y':'UTC' }}</time>
            </div>
            <div class="mt-2" role="img" [attr.aria-label]="review.rating + ' out of 5 stars'">
                <p-rating [(ngModel)]="review.rating" [readonly]="true" [stars]="5" class="text-teal-500"></p-rating>
            </div>
            <p class="mt-3 whitespace-pre-line text-sm leading-6 text-zinc-600 dark:text-zinc-400">{{ review.comment }}</p>
        </div>
    </div>
</article>
